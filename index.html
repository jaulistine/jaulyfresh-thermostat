<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAULISTINE | Spring Smart Thermostat</title>
<style>
:root{
  --navy:#172c79; --blue:#238bc7; --pink:#f3a9c9; --lav:#bca5e9;
  --cream:#fff8f4; --glass:rgba(255,255,255,.76);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{
  display:flex;align-items:center;justify-content:center;min-height:100vh;padding:12px;
  background:linear-gradient(135deg,#f5dbe5,#dcecff 52%,#fff0d9);color:var(--navy)
}
.thermostat{
  width:min(100%,1180px); aspect-ratio:1.43; min-height:490px; padding:clamp(14px,2.2vw,30px);
  position:relative;overflow:hidden;border-radius:clamp(24px,4vw,54px);
  background:linear-gradient(145deg,#fffaf5 0%,#f8e5ed 52%,#e7edff 100%);
  border:3px solid rgba(255,255,255,.96);
  box-shadow:0 18px 48px rgba(75,64,106,.24),inset 0 0 0 2px rgba(222,183,206,.48),inset 0 -8px 18px rgba(176,155,201,.12)
}
.thermostat:before{
  content:"";position:absolute;inset:clamp(9px,1.3vw,17px);border-radius:clamp(19px,3vw,39px);
  background:linear-gradient(90deg,rgba(255,255,255,.08),rgba(255,255,255,.28)),url("spring-floral-bg.png") center/cover;
  border:3px solid rgba(255,255,255,.95);box-shadow:inset 0 0 0 2px rgba(35,48,110,.14),0 0 0 2px rgba(233,170,205,.34)
}
.screen{
  position:relative;z-index:1;height:100%;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(245px,.8fr);
  grid-template-rows:auto 1fr;gap:clamp(12px,2vw,24px);padding:clamp(12px,2vw,25px)
}
header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:0 2%;}
.brand-wrap{min-width:0}
.brand{font-family:"Brush Script MT","Segoe Script",cursive;font-size:clamp(36px,5.3vw,76px);line-height:.98;font-style:italic;font-weight:600;letter-spacing:-2px;color:#172b83;text-shadow:0 2px 0 rgba(255,255,255,.9),0 4px 8px rgba(45,44,113,.16)}
.sub{font-size:clamp(12px,1.6vw,22px);font-weight:600;letter-spacing:.03em;color:#1c347e;margin:4px 0 0 20%;text-shadow:0 1px 0 white}
.clock{text-align:left;flex:0 0 auto;padding:4px 1% 0;color:#182f82;text-shadow:0 1px 0 white}
.clock-label{font-size:clamp(14px,2.1vw,28px);font-weight:600}
.clock-value{font-size:clamp(31px,4.1vw,58px);line-height:1.05;font-weight:750;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.main-readout{display:flex;flex-direction:column;justify-content:center;align-items:center;min-width:0;padding:0 2% 3%;text-align:center}
.temp-label{font-size:clamp(11px,1.4vw,18px);letter-spacing:.16em;font-weight:700;color:#344a8b;text-shadow:0 1px 0 white}
.temperature{font-size:clamp(100px,17vw,230px);line-height:.92;font-weight:800;letter-spacing:-.075em;color:#111d52;text-shadow:0 3px 0 rgba(255,255,255,.85),0 8px 16px rgba(30,35,90,.24);white-space:nowrap}
.temperature .degree{font-size:.48em;vertical-align:top;letter-spacing:-.02em;margin-left:.04em}
.targetline{margin-top:clamp(10px,1.5vw,20px);padding:clamp(7px,1vw,13px) clamp(22px,3vw,42px);border-radius:40px;background:linear-gradient(100deg,rgba(255,224,243,.94),rgba(255,255,255,.9),rgba(221,208,255,.94));border:2px solid rgba(255,255,255,.98);box-shadow:0 5px 14px rgba(94,74,143,.18);font-size:clamp(18px,2.6vw,34px);font-weight:500;color:#26387f;white-space:nowrap}
.targetline strong{font-weight:800}
.spring-vibes{margin-top:auto;align-self:flex-start;padding:0 0 0 5%;font-family:"Brush Script MT","Segoe Script",cursive;font-style:italic;font-size:clamp(30px,4.5vw,61px);color:white;text-shadow:0 2px 6px rgba(52,42,104,.45);white-space:nowrap}
.info{display:flex;flex-direction:column;justify-content:center;gap:clamp(7px,1vw,13px);min-width:0;padding:3% 1% 4% 0}
.info-card{display:grid;grid-template-columns:clamp(45px,5.6vw,72px) 1fr;align-items:center;gap:8px;min-height:clamp(62px,8.1vw,105px);padding:clamp(8px,1vw,13px) clamp(10px,1.4vw,18px);border-radius:clamp(14px,2vw,24px);background:rgba(255,255,255,.78);border:1.5px solid rgba(255,255,255,.98);box-shadow:0 4px 13px rgba(70,75,130,.12);backdrop-filter:blur(5px)}
.icon{font-size:clamp(28px,3.6vw,48px);text-align:center;filter:drop-shadow(0 2px 2px rgba(60,60,100,.12))}
.card-label{font-size:clamp(12px,1.8vw,24px);font-weight:600;line-height:1.15;color:#1b347e}
.card-value{font-size:clamp(17px,2.5vw,33px);font-weight:800;line-height:1.12;color:#18327d;white-space:normal;overflow-wrap:anywhere}
#air{color:#169766}
.footer-note{position:absolute;right:3%;bottom:1%;font-size:clamp(8px,.9vw,12px);letter-spacing:.12em;color:rgba(26,47,112,.72);font-weight:700}
@media(max-width:650px){
 body{padding:5px}.thermostat{aspect-ratio:auto;min-height:650px;border-radius:25px}.screen{grid-template-columns:1fr;grid-template-rows:auto auto auto;gap:10px;padding:12px}
 header{grid-column:1;align-items:center}.brand{font-size:clamp(34px,9vw,54px)}.sub{font-size:11px;margin-left:8%}.clock-label{font-size:14px}.clock-value{font-size:28px}
 .main-readout{min-height:240px;padding:8px 0}.temperature{font-size:clamp(105px,28vw,165px)}.spring-vibes{font-size:35px;margin-top:12px}
 .info{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0}.info-card{min-height:74px;grid-template-columns:38px 1fr;padding:8px}.icon{font-size:27px}.card-label{font-size:11px}.card-value{font-size:16px}.footer-note{display:none}
}
@media(max-width:380px){.thermostat{min-height:620px}.info-card{grid-template-columns:30px 1fr;gap:4px}.icon{font-size:23px}.card-label{font-size:10px}.card-value{font-size:14px}}
</style>
</head>
<body>
<main class="thermostat" aria-label="JAULISTINE Smart Thermostat">
 <div class="screen">
  <header>
   <div class="brand-wrap"><div class="brand">Jaulistine</div><div class="sub">SMART THERMOSTAT</div></div>
   <div class="clock"><div class="clock-label">SL Time</div><div class="clock-value" id="time">--:--</div></div>
  </header>
  <section class="main-readout">
   <div class="temp-label">INDOOR TEMPERATURE</div>
   <div class="temperature"><span id="temp">70°F</span></div>
   <div class="targetline">Target: <strong id="target">72°F</strong></div>
   <div class="spring-vibes">Spring Vibes ♡</div>
  </section>
  <section class="info" aria-label="Thermostat information">
   <div class="info-card"><div class="icon">🌤️</div><div><div class="card-label">Weather</div><div class="card-value" id="weather">Sunny</div></div></div>
   <div class="info-card"><div class="icon">💧</div><div><div class="card-label">Humidity</div><div class="card-value" id="humidity">45%</div></div></div>
   <div class="info-card"><div class="icon">💨</div><div><div class="card-label">Air Quality</div><div class="card-value" id="air">Good</div></div></div>
   <div class="info-card"><div class="icon">✿</div><div><div class="card-label">Fan Status</div><div class="card-value" id="fan">AUTO</div></div></div>
   <div class="info-card"><div class="icon">🗓️</div><div><div class="card-label">Schedule</div><div class="card-value" id="schedule">DAY</div></div></div>
  </section>
  <div class="footer-note">JAULISTINE · SPRING EDITION</div>
 </div>
</main>
<script>
// Keep the exact query-string names and display IDs used by the existing LSL controller.
const params = new URLSearchParams(window.location.search);
function showValue(id, parameter, fallback) {
  const value = params.get(parameter);
  document.getElementById(id).textContent = value !== null && value !== "" ? value : fallback;
}
showValue("temp", "temp", "70°F");
showValue("target", "target", "72°F");
showValue("time", "time", "--:--");
showValue("weather", "weather", "Sunny");
showValue("humidity", "humidity", "45%");
showValue("air", "air", "Good");
showValue("fan", "fan", "AUTO");
showValue("schedule", "schedule", "DAY");
</script>
</body>
</html>
